name: Scrape Competitor Prices

on:
  # PAUSED: uncomment to activate bi-weekly scraping (1st and 15th of each month)
  # schedule:
  #   - cron: '0 6 1,15 * *'
  workflow_dispatch:
    # Manual trigger — run from GitHub Actions UI when needed

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit updated prices.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r scrapers/requirements.txt
          playwright install chromium --with-deps

      - name: Run scrapers
        run: |
          cd scrapers
          python run_scrapers.py
        continue-on-error: true  # partial failures are ok; we use fallbacks

      - name: Commit updated prices
        run: |
          git config user.name "elli-pricing-bot"
          git config user.email "pricing-bot@elli.eco"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "No price changes detected"
          else
            git commit -m "chore: update competitor pricing data [$(date -u +%Y-%m-%d)]"
            git push
          fi

      - name: Notify on scraper failures
        if: failure()
        run: |
          echo "::warning::One or more scrapers failed. Check the logs and update fallback values if needed."
